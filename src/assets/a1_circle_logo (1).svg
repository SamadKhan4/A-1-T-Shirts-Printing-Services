<svg width="100%" viewBox="0 0 680 680" role="img" xmlns="http://www.w3.org/2000/svg" style="">
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A-1 Prints circular logo</title>
  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Circular black logo with lavender purple shield and white t-shirt hanger icon, A-1 text in center</desc>

  <defs>
    
    <clipPath id="circleClip">
      <circle cx="340" cy="340" r="300"/>
    </clipPath>
  <mask id="imagine-text-gaps-agqy45" maskUnits="userSpaceOnUse"><rect x="0" y="0" width="680" height="680" fill="white"/><rect x="254.1640625" y="332" width="170.671875" height="140" fill="black" rx="2"/><rect x="216.4140625" y="472" width="247.171875" height="21" fill="black" rx="2"/><rect x="278.203125" y="494" width="123.59375" height="21" fill="black" rx="2"/><rect x="203.046875" y="536" width="273.90625" height="16" fill="black" rx="2"/></mask></defs>

  <!-- Outer ring — lavender purple -->
